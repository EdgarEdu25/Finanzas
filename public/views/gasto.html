<div class="toast-wrap" id="toastWrap"></div>

<div class="encabezado-pagina">
    <h1 id="tituloFormGasto">Nuevo gasto</h1>
    <p>Registra un gasto de forma rápida. Agrega detalle solo si lo necesitas.</p>
</div>

<div class="panel panel-ancho">
    <form id="formGasto">
        <input type="hidden" id="pk_gasto">

        <div class="campo">
            <label for="nombre_gasto">Nombre del gasto</label>
            <input type="text" id="nombre_gasto" placeholder="Ej. Supermercado" required>
        </div>

        <div class="campo dinero">
            <label for="total">Total</label>
            <input type="number" id="total" step="0.01" placeholder="0.00" required>
        </div>

        <div class="campo">
            <label for="fk_categoria">Categoría</label>
            <select id="fk_categoria" required>
                <option value="">Selecciona una categoría</option>
            </select>
        </div>

        <button type="button" class="detalle-toggle" id="btnToggleDetalle" onclick="toggleDetalle()">
            + Agregar detalle
        </button>

        <div id="detalleGasto" class="oculto">
            <div class="campo dinero">
                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" step="0.01" placeholder="Opcional">
            </div>

            <div class="campo dinero">
                <label for="precio">Precio unitario</label>
                <input type="number" id="precio" step="0.01" placeholder="Opcional">
            </div>

            <div class="campo">
                <label for="description">Descripción</label>
                <input type="text" id="description" placeholder="Opcional">
            </div>
        </div>

        <button type="submit" class="btn btn-primario">Guardar gasto</button>
        <button type="button" class="btn btn-secundario d-none" id="btnCancelar" style="width:100%; margin-top:8px;" onclick="cancelarEdicion()">Cancelar edición</button>
    </form>
</div>

<div class="atajo-historial">
    <button class="btn btn-fantasma" onclick="cargarVista('historial_gasto')">Ver historial de gastos →</button>
</div>
