<div class="toast-wrap" id="toastWrap"></div>

<div class="encabezado-lista">
    <div>
        <h1>Límite de Gasto</h1>
        <p class="resumen-historial" id="resumen">Cargando...</p>
    </div>
    <span class="total-chip" id="chip">Sin límite hoy</span>
</div>

<div id="vistaLista">
    <div class="barra-acciones">
        <button class="btn btn-nuevo" onclick="abrirFormulario()">+ Nuevo límite</button>
    </div>
    <div class="lista-gastos" id="lista"></div>
    <div class="ver-mas-wrap" id="verMasWrap"></div>
</div>

<div id="vistaForm" class="d-none">
    <div class="panel panel-ancho">
        <h2 class="titulo-form" id="tituloForm">Nuevo límite</h2>

        <form id="formLimite">
            <input type="hidden" id="pk_limite">

            <div class="campo">
                <label for="fecha">Fecha</label>
                <input type="date" id="fecha" required>
            </div>

            <div class="campo dinero">
                <label for="monto">Monto máximo</label>
                <input type="number" id="monto" step="0.01" placeholder="0.00" required>
            </div>

            <div class="campo">
                <label for="comentario">Comentario</label>
                <input type="text" id="comentario" placeholder="Opcional">
            </div>

            <div class="form-botones">
                <button type="button" class="btn btn-secundario" onclick="cerrarFormulario()">Cancelar</button>
                <button type="submit" class="btn btn-primario">Guardar</button>
            </div>
        </form>
    </div>
</div>
